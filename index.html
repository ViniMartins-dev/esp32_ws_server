<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor do Sensor ESP32</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        .valor {
            font-size: 64px;
            font-weight: bold;
            margin: 30px;
        }

        .barra {
            width: 300px;
            height: 20px;
            background-color: #ddd;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
        }

        .progresso {
            width: 0%;
            height: 100%;
            background-color: #28a745;
            transition: width 0.3s;
        }

        input {
            padding: 10px;
            width: 180px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Monitor do Sensor</h1>

    <p id="status">Desconectado</p>

    <input type="text" id="ip" placeholder="IP do ESP32">

    <button onclick="conectar()">Conectar</button>

    <div class="valor">
        <span id="leitura">--</span>
    </div>

    <div class="barra">
        <div class="progresso" id="progresso"></div>
    </div>

    <script>
        let ws;

        function conectar() {
            const ip = document.getElementById("ip").value.trim();

            if (!ip) {
                alert("Digite o IP do ESP32!");
                return;
            }

            // Fecha a conexão anterior, se existir
            if (ws) {
                ws.close();
            }

            document.getElementById("status").textContent = "Conectando...";

            ws = new WebSocket(`ws://${ip}/ws`);

            ws.onopen = () => {
                document.getElementById("status").textContent = "Conectado";
                ws.send("conectado");
            };

            ws.onmessage = (event) => {
                const valor = Number(event.data);

                if (!Number.isFinite(valor)) {
                    return;
                }

                document.getElementById("leitura").textContent =
                    valor.toFixed(2) + " lux";

                const porcentagem = (valor / 763) * 100;

                document.getElementById("progresso").style.width =
                    Math.min(Math.max(porcentagem, 0), 100) + "%";
            };

            ws.onerror = () => {
                document.getElementById("status").textContent =
                    "Erro na conexão";
            };

            ws.onclose = () => {
                document.getElementById("status").textContent =
                    "Desconectado";
            };
        }
    </script>

</body>

</html>
